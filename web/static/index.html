<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralize | Virtualization Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-server"></i> Centralize
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span> Live Monitoring
            </div>
        </header>

        <main>
            <!-- Host Section -->
            <section class="host-section glass-panel">
                <div class="section-header">
                    <h2><i class="fa-solid fa-microchip"></i> Host Node</h2>
                    <span id="host-name" class="host-badge">Loading...</span>
                </div>
                <div class="host-stats">
                    <div class="stat-card">
                        <div class="icon"><i class="fa-solid fa-memory"></i></div>
                        <div class="info">
                            <span class="label">Total Memory</span>
                            <span class="value" id="host-mem">-- GB</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="icon"><i class="fa-solid fa-layer-group"></i></div>
                        <div class="info">
                            <span class="label">CPU Cores</span>
                            <span class="value" id="host-cores">--</span>
                        </div>
                    </div>
                    <div class="stat-card wide">
                        <div class="icon"><i class="fa-solid fa-fingerprint"></i></div>
                        <div class="info">
                            <span class="label">CPU Model</span>
                            <span class="value" id="host-cpu">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- VM Section -->
            <section class="vm-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-desktop"></i> Virtual Machines</h2>
                    <div class="refresh-timer">Updated: <span id="last-updated">Just now</span></div>
                </div>

                <div class="vm-grid" id="vm-grid">
                    <!-- VMs will be injected here -->
                    <div class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Loading infrastructure...
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
