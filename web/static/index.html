<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizegg | Virtualization Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Centralizegg Logo" style="height: 50px; margin-right: 10px;"> Centralizegg
            </div>
            <div class="controls" style="display:flex; gap:15px; align-items:center;">
                <div class="status-indicator">
                    <span class="status-dot"></span> Live Monitoring
                </div>
                <button id="config-btn" class="icon-btn"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- Config Modal -->
        <div id="config-modal" class="modal">
            <div class="modal-content glass-panel">
                <div class="modal-header">
                    <h2>Server Configuration</h2>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="add-server-form">
                        <h3 id="form-title">Add New Server</h3>
                        <input type="hidden" id="srv-id"> <!-- Hidden ID for Editing -->
                        <input type="text" id="srv-name" placeholder="Friendly Name (e.g. Prod-1)">
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="srv-ip" placeholder="IP Address (e.g. 192.168.1.50)" style="flex:2;">
                            <input type="number" id="srv-port" placeholder="Port (22)" style="flex:1;">
                        </div>
                        <input type="text" id="srv-user" placeholder="SSH Username (e.g. root)">

                        <div class="auth-type-selector"
                            style="display:flex; gap:15px; margin: 10px 0; color:var(--text-secondary); font-size:0.9rem;">
                            <label><input type="radio" name="authType" value="key" checked> SSH Key</label>
                            <label><input type="radio" name="authType" value="password"> Password</label>
                        </div>

                        <input type="password" id="srv-pass" placeholder="Password (Leave empty to keep current)"
                            style="display:none;">
                        <input type="text" id="srv-key" placeholder="Key Path (default: /root/.ssh/id_rsa)">

                        <div class="form-actions" style="display:flex; gap:10px;">
                            <button id="add-server-btn" class="primary-btn">Add Server</button>
                            <button id="cancel-edit-btn" class="secondary-btn"
                                style="display:none; background:transparent; border:1px solid var(--text-secondary); color:var(--text-secondary); padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
                        </div>
                    </div>
                    <div class="server-list">
                        <h3>Managed Servers</h3>
                        <ul id="server-list-ul">
                            <!-- Injected via JS -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <main>
            <!-- Host Section -->
            <section class="host-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-microchip"></i> Host Nodes</h2>
                </div>
                <div id="host-nodes-container" class="host-nodes-grid">
                    <div class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Loading host info...
                    </div>
                </div>
            </section>

            <!-- VM Section -->
            <section class="vm-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-desktop"></i> Virtual Machines</h2>
                    <div class="refresh-timer">Updated: <span id="last-updated">Just now</span></div>
                </div>

                <div class="vm-grid" id="vm-grid">
                    <!-- VMs will be injected here -->
                    <div class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Loading infrastructure...
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
